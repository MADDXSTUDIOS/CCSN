plugins {
    id 'java-library'
    id 'idea'
    // If this version can't be found, copy the moddev version from the
    // official NeoForge 1.21.1 MDK's build.gradle into here.
    id 'net.neoforged.moddev' version '2.0.80'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    maven {
        url = 'https://maven.squiddev.cc'
        content { includeGroup('cc.tweaked') }
    }
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    // CC:Tweaked API to compile against, and the full mod at runtime so
    // `runClient` launches with ComputerCraft installed.
    compileOnly "cc.tweaked:cc-tweaked-${minecraft_version}-core-api:${cc_version}"
    compileOnly "cc.tweaked:cc-tweaked-${minecraft_version}-common-api:${cc_version}"
    compileOnly "cc.tweaked:cc-tweaked-${minecraft_version}-forge-api:${cc_version}"
    runtimeOnly "cc.tweaked:cc-tweaked-${minecraft_version}-forge:${cc_version}"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
